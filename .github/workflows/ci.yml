name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs needs tags/history for versioning

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --python ${{ matrix.python-version }} --all-groups

      - name: Download spaCy models
        run: |
          uv pip install pip  # spacy download shells out to pip
          uv run --no-sync poe models

      - name: Check (format, lint, typecheck, doctest, test)
        run: uv run --no-sync poe check

      - name: Run scripts
        run: uv run --no-sync poe run-example

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.2

      - name: Install
        run: uv sync --group dev

      - name: Build sdist and wheel
        run: uv run --no-sync poe build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install distribution and run smoke test
        run: |
          uv venv --seed test_env
          source test_env/bin/activate
          pip install dist/*.whl
          cd $(mktemp -d)
          python -c "
          import gram2vec
          from gram2vec import FeatureConfig, Gram2Vec, Vocab
          import spacy

          print('Installed gram2vec version:', gram2vec.__version__)

          vocab = Vocab(language='en')
          print('English pos_unigrams count:', len(vocab.get('pos_unigrams')))

          nlp = spacy.blank('en')
          nlp.add_pipe('sentencizer')
          cfg = FeatureConfig.only('func_words', 'num_tokens')
          g2v = Gram2Vec(model=nlp, config=cfg)
          df = g2v.from_documents(['The quick brown fox jumps over the lazy dog.'])
          print('Extracted features shape:', df.shape)
          assert df.shape[0] == 1
          assert len(df.columns) > 0
          print('All verification commands passed successfully!')
          "

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create releases
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}"
          --generate-notes
