repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.1
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.13.2
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: []

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --no-sync mypy src
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
