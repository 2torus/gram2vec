[project]
name = "gram2vec"
dynamic = ["version"]
description="Gram2vec is a document embedding software that maps strings to high-dimensional vectors based off stylistic features."
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = {file = "LICENSE"}
#urls = {source = "https://github.com/iarpa-hiatus/eric-gram2vec"} #! will need to be updated
dependencies = [
    "demoji>=1.1.0",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "scipy>=1.10.1",
    "spacy>=3.7.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    ]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/gram2vec"]

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.12.3",
    "mypy>=2.4.0",
    "nbclient>=0.11.0",
    "pandas-stubs>=3.0.5.260914",
    "poethepoet>=0.33.0",
    "ruff>=0.17.2",
    "scipy-stubs>=1.17.1.5",
    "typos>=1.51.1",
]
test = [
    "pytest>=8.3.5",
    "pytest-xdist>=3.8.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-with-pdf>=0.9.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]

[tool.typos.default.extend-words]
certifi = "certifi"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true


[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["A", "B", "C", "D", "E", "F", "G", "I", "N"]
ignore = [
    "E501",  # line length is handled by ruff format; string literals & regexes can remain long
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D401",  # first line of docstring imperative mood
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]
"tests/*" = ["D"]
"script/*" = ["D"]
"docs/*" = ["D"]
"*.ipynb" = ["D", "F401", "I001"]

[tool.poe.env]
UV_NO_SYNC = "1"

[tool.poe.tasks]
check = { sequence = ["format-check", "lint", "typecheck", "doctest", "test"], help = "Run all verification checks (format, lint, typing, doctest, test)" }
fix = { sequence = ["format", "lint-fix"], help = "Auto-format and auto-fix lint issues" }

format = { cmd = "ruff format src test script", help = "Format code with ruff" }
format-check = { cmd = "ruff format --check src test script", help = "Check formatting without modifying files" }
lint = { cmd = "ruff check src test script", help = "Lint code with ruff" }
lint-fix = { cmd = "ruff check --fix src test script", help = "Lint code and apply safe auto-fixes" }
typecheck = { cmd = "mypy src", help = "Type check source code with mypy" }
doctest = { cmd = "pytest --doctest-modules src", help = "Run doctests with pytest" }
test = { cmd = "pytest", help = "Run tests with pytest" }
build = { cmd = "uv build", help = "Build sdist and wheel into dist/" }

models = { sequence = ["model-en", "model-ru", "model-zh"], help = "Download spaCy language models" }
model-en = { shell = "python -c 'import en_core_web_lg' 2>/dev/null || python -m spacy download en_core_web_lg", help = "Download spaCy English model (en_core_web_lg)" }
model-ru = { shell = "python -c 'import ru_core_news_lg' 2>/dev/null || python -m spacy download ru_core_news_lg", help = "Download spaCy Russian model (ru_core_news_lg)" }
model-zh = { shell = "python -c 'import zh_core_web_sm' 2>/dev/null || python -m spacy download zh_core_web_sm", help = "Download spaCy Chinese model (zh_core_web_sm)" }

clean = { cmd = "python -c \"import shutil, glob; [shutil.rmtree(p, ignore_errors=True) for p in glob.glob('.*cache') + glob.glob('dist') + glob.glob('site') + glob.glob('src/*.egg-info')]\"", help = "Remove cache and build artifacts" }

docs-serve = { cmd = "mkdocs serve", help = "Serve documentation locally at http://127.0.0.1:8000" }
docs-build = { cmd = "mkdocs build", help = "Build static HTML documentation into site/" }
docs-pdf = { shell = "ENABLE_PDF_EXPORT=1 mkdocs build", help = "Build HTML documentation and export unified PDF manual" }


[tool.poe.tasks.run-example]
help = "Run all commands in script/"
shell = "set -e; for f in $(find script -name '*.py'); do echo \" Running script \"$f; python \"$f\"; done"

[tool.poe.tasks.run-notebooks]
help = "Run all Jupyter notebooks in docs/notebooks"
deps = ["models"]
cmd = "jupyter-execute docs/notebooks/*.ipynb"
