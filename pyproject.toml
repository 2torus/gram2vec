[project]
name = "gram2vec"
dynamic = ["version"]
description="Gram2vec is a document embedding software that maps strings to high-dimensional vectors based off stylistic features."
readme = "README.md"
requires-python = ">=3.11, <3.15"
license = {file = "LICENSE"}
#urls = {source = "https://github.com/iarpa-hiatus/eric-gram2vec"} #! will need to be updated
dependencies = [
    "demoji>=1.1.0",
    "numpy>=1.24.4",
    "pandas>=2.0.3",
    "scipy>=1.10.1",
    "spacy>=3.7.5",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    ]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
[tool.hatch.build]
include = ["*.txt"]

[tool.hatch.version]
source = "vcs"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "ipython>=8.12.3",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "ruff>=0.17.2",
    "scipy-stubs>=1.17.1.5",
]
test = [
    "pytest>=8.3.5",
]


[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["A", "B", "C", "D", "E", "F", "G", "I", "N"]
ignore = [
    "E501",  # line length is handled by ruff format; string literals & regexes can remain long
    "D105",  # missing docstring in magic method
    "D107",  # missing docstring in __init__
    "D203",  # one-blank-line-before-class (conflicts with D211)
    "D213",  # multi-line-summary-second-line (conflicts with D212)
    "D401",  # first line of docstring imperative mood
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["D"]
"tests/*" = ["D"]
"src/test_*" = ["D"]
"docs/*" = ["D"]
"*.ipynb" = ["D", "F401", "I001"]

